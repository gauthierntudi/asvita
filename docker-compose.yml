services:
  postgres:
    image: postgres:16-alpine
    container_name: asvita-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: asvita
      POSTGRES_PASSWORD: asvita
      POSTGRES_DB: asvita
    volumes:
      - asvita_pg_data:/var/lib/postgresql/data

volumes:
  asvita_pg_data:
